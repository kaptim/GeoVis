model: sota_cnn_net
model_name: mobile_net_v2
task: classification
subtask: fine-tuning # fine-tuning, feature-extraction, from-scratch
qat: False # whether to use a model for fine-tuning which was trained using quantisation-aware training
fine_tune_at: last # last: unfreeze last block, full: train the whole network
countries:
  - IT
img_height: 224
img_width: 224
preprocessor: mobile_net_v2
targets:
  - region
batch_size: 128
lr: 0.0001
optimizer: adam
loss: ce
epochs: 100
metrics:
  - acc
dropout_dense: 0.4